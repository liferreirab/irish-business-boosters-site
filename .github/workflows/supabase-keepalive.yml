name: Keep Supabase awake

# The free Supabase plan pauses a project after a week without activity.
# Every 3 days this asks the "check" Edge Function to look up a lead that
# doesn't exist: a real database query, no email, nothing saved.
# If the project is paused anyway, the run fails and GitHub emails you.

on:
  schedule:
    - cron: "17 8 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the CRM database
        run: |
          code=$(curl -sS -m 60 -o response.txt -w "%{http_code}" \
            -X POST "https://tbgxeqauakiydzwmqyyf.supabase.co/functions/v1/check" \
            -H "Content-Type: application/json" \
            -d '{"action":"call","leadId":"00000000-0000-0000-0000-000000000000"}') || code=000
          echo "HTTP $code: $(cat response.txt 2>/dev/null)"
          # 404 = the database answered "no such lead", which is what we want.
          if [ "$code" != "404" ]; then
            echo "::error::Supabase did not answer as expected (HTTP $code). Check if the project is paused."
            exit 1
          fi
